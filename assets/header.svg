<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160" fill="none">
  <defs>
    <style>
      .gold-title {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 32px;
        font-weight: bold;
        fill: #D4AF37;
        letter-spacing: 10px;
        text-anchor: middle;
      }
      .gold-sub {
        font-family: 'Georgia', serif;
        font-size: 13px;
        fill: #C5A059;
        letter-spacing: 4px;
        text-anchor: middle;
      }
      .parch-desc {
        font-family: 'Georgia', serif;
        font-size: 12px;
        font-style: italic;
        fill: #D1C7B7;
        letter-spacing: 2px;
        text-anchor: middle;
      }
      .ornament {
        fill: #D4AF37;
        font-size: 14px;
        text-anchor: middle;
      }
      .frame-line {
        stroke: #C5A059;
        stroke-width: 0.8;
        opacity: 0.45;
      }
      .accent-line {
        stroke: #D4AF37;
        stroke-width: 1.2;
        opacity: 0.8;
      }
      .astrolabe-bg {
        stroke: #D4AF37;
        stroke-width: 0.6;
        opacity: 0.06;
      }
    </style>
  </defs>

  <!-- Sacred Geometry Watermark (Static, Subtle) -->
  <g class="astrolabe-bg">
    <circle cx="400" cy="80" r="70" />
    <circle cx="400" cy="80" r="55" stroke-dasharray="3 5" />
    <line x1="400" y1="10" x2="400" y2="150" />
    <line x1="330" y1="80" x2="470" y2="80" />
    <line x1="350" y1="30" x2="450" y2="130" />
    <line x1="350" y1="130" x2="450" y2="30" />
  </g>

  <!-- Outer Hairline Frame -->
  <rect x="20" y="10" width="760" height="140" rx="2" class="frame-line" />
  <rect x="25" y="15" width="750" height="130" rx="2" class="frame-line" opacity="0.25" />

  <!-- Corner Accents -->
  <path d="M 20 25 L 35 25 M 25 20 L 25 35" class="accent-line" />
  <path d="M 780 25 L 765 25 M 775 20 L 775 35" class="accent-line" />
  <path d="M 20 135 L 35 135 M 25 140 L 25 125" class="accent-line" />
  <path d="M 780 135 L 765 135 M 775 140 L 775 125" class="accent-line" />

  <!-- Top Flor-de-lis Motif -->
  <text x="400" y="34" class="ornament">⚜  ·  ✦  ·  ⚜</text>

  <!-- Main Title (Solid, No Blinking) -->
  <text x="405" y="74" class="gold-title">GAMESAPECA</text>

  <!-- Horizontal Separator with Center Jewel -->
  <line x1="240" y1="88" x2="370" y2="88" class="accent-line" />
  <circle cx="400" cy="88" r="2.5" fill="#D4AF37" />
  <line x1="430" y1="88" x2="560" y2="88" class="accent-line" />

  <!-- Subtitle & Description -->
  <text x="400" y="112" class="gold-sub">CODEX CYBERNETICUS · HOMO UNIVERSALIS</text>
  <text x="400" y="134" class="parch-desc">Security Researcher · Bug Bounty Hunter · SAST &amp; Reverse Engineering</text>
</svg>
