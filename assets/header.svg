<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&amp;family=EB+Garamond:ital,wght@1,500&amp;display=swap');
      .gold-title {
        font-family: 'Cinzel', 'Georgia', 'Times New Roman', serif;
        font-size: 34px;
        font-weight: 700;
        fill: #D4AF37;
        letter-spacing: 12px;
        text-anchor: middle;
      }
      .gold-sub {
        font-family: 'Cinzel', 'Georgia', serif;
        font-size: 13px;
        font-weight: 500;
        fill: #C5A059;
        letter-spacing: 5px;
        text-anchor: middle;
      }
      .parch-desc {
        font-family: 'EB Garamond', 'Georgia', serif;
        font-size: 13px;
        font-style: italic;
        fill: #D1C7B7;
        letter-spacing: 2px;
        text-anchor: middle;
      }
      .ornament {
        fill: #D4AF37;
        font-size: 14px;
        text-anchor: middle;
      }
      .frame-line {
        stroke: #C5A059;
        stroke-width: 0.8;
        opacity: 0.6;
      }
      .accent-line {
        stroke: #D4AF37;
        stroke-width: 1.2;
        opacity: 0.8;
      }
    </style>
  </defs>

  <!-- Outer Hairline Frame with Ornate Insets -->
  <rect x="20" y="10" width="760" height="140" rx="2" class="frame-line" stroke-dasharray="760 140" />
  <rect x="25" y="15" width="750" height="130" rx="2" class="frame-line" opacity="0.3" />

  <!-- Corner Fleurons / Accents -->
  <path d="M 20 25 L 35 25 M 25 20 L 25 35" class="accent-line" />
  <path d="M 780 25 L 765 25 M 775 20 L 775 35" class="accent-line" />
  <path d="M 20 135 L 35 135 M 25 140 L 25 125" class="accent-line" />
  <path d="M 780 135 L 765 135 M 775 140 L 775 125" class="accent-line" />

  <!-- Top Ornament -->
  <text x="400" y="32" class="ornament">⚜  ·  ✦  ·  ⚜</text>

  <!-- Main Title -->
  <text x="406" y="74" class="gold-title">GAMESAPECA</text>

  <!-- Horizontal Accented Separator -->
  <line x1="220" y1="88" x2="360" y2="88" class="accent-line" />
  <circle cx="400" cy="88" r="2.5" fill="#D4AF37" />
  <line x1="440" y1="88" x2="580" y2="88" class="accent-line" />

  <!-- Subtitle -->
  <text x="400" y="110" class="gold-sub">CODEX CYBERNETICUS · HOMO UNIVERSALIS</text>

  <!-- Description -->
  <text x="400" y="132" class="parch-desc">Security Researcher · Bug Bounty Hunter · SAST &amp; Reverse Engineering</text>
</svg>
