<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 160" width="100%" height="160" fill="none">
  <defs>
    <style>
      @keyframes rotateAstrolabe {
        from { transform: rotate(0deg); }
        to { transform: rotate(360deg); }
      }
      @keyframes counterRotateAstrolabe {
        from { transform: rotate(360deg); }
        to { transform: rotate(0deg); }
      }

      .gold-title {
        font-family: 'Georgia', 'Times New Roman', serif;
        font-size: 32px;
        font-weight: bold;
        fill: #D4AF37;
        letter-spacing: 10px;
        text-anchor: middle;
      }
      .gold-sub {
        font-family: 'Georgia', serif;
        font-size: 13px;
        fill: #C5A059;
        letter-spacing: 4px;
        text-anchor: middle;
      }
      .parch-desc {
        font-family: 'Georgia', serif;
        font-size: 12px;
        font-style: italic;
        fill: #D1C7B7;
        letter-spacing: 2px;
        text-anchor: middle;
      }
      .ornament {
        fill: #D4AF37;
        font-size: 14px;
        text-anchor: middle;
      }
      .frame-line {
        stroke: #C5A059;
        stroke-width: 0.8;
        opacity: 0.45;
      }
      .accent-line {
        stroke: #D4AF37;
        stroke-width: 1.2;
        opacity: 0.8;
      }

      /* Animated Astrolabe Layers */
      .astrolabe-outer {
        stroke: #D4AF37;
        stroke-width: 0.75;
        opacity: 0.09;
        transform-origin: 400px 74px;
        animation: rotateAstrolabe 75s linear infinite;
      }
      .astrolabe-inner {
        stroke: #C5A059;
        stroke-width: 0.65;
        opacity: 0.07;
        transform-origin: 400px 74px;
        animation: counterRotateAstrolabe 50s linear infinite;
      }
    </style>
  </defs>

  <!-- BACKGROUND: Animated Rotating Astrolabe & Sacred Geometry -->
  <g class="astrolabe-outer">
    <circle cx="400" cy="74" r="70" />
    <circle cx="400" cy="74" r="62" stroke-dasharray="3 5" />
    <circle cx="400" cy="74" r="48" stroke-dasharray="6 4" />
    <!-- 8 Compass / Astrolabe Axes -->
    <line x1="400" y1="0" x2="400" y2="148" />
    <line x1="326" y1="74" x2="474" y2="74" />
    <line x1="348" y1="22" x2="452" y2="126" />
    <line x1="348" y1="126" x2="452" y2="22" />
    <!-- Geometry Squares -->
    <rect x="350.5" y="24.5" width="99" height="99" rx="1" />
  </g>

  <g class="astrolabe-inner">
    <circle cx="400" cy="74" r="35" stroke-dasharray="2 3" />
    <polygon points="400,34 435,94 365,94" />
    <polygon points="400,114 435,54 365,54" />
  </g>

  <!-- Outer Hairline Frame -->
  <rect x="20" y="10" width="760" height="140" rx="2" class="frame-line" />
  <rect x="25" y="15" width="750" height="130" rx="2" class="frame-line" opacity="0.25" />

  <!-- Corner Accents -->
  <path d="M 20 25 L 35 25 M 25 20 L 25 35" class="accent-line" />
  <path d="M 780 25 L 765 25 M 775 20 L 775 35" class="accent-line" />
  <path d="M 20 135 L 35 135 M 25 140 L 25 125" class="accent-line" />
  <path d="M 780 135 L 765 135 M 775 140 L 775 125" class="accent-line" />

  <!-- Top Flor-de-lis Motif -->
  <text x="400" y="34" class="ornament">⚜  ·  ✦  ·  ⚜</text>

  <!-- Main Title (Solid, Crisp, No Blinking) -->
  <text x="405" y="74" class="gold-title">GAMESAPECA</text>

  <!-- Horizontal Separator with Center Jewel -->
  <line x1="240" y1="88" x2="370" y2="88" class="accent-line" />
  <circle cx="400" cy="88" r="2.5" fill="#D4AF37" />
  <line x1="430" y1="88" x2="560" y2="88" class="accent-line" />

  <!-- Subtitle & Description -->
  <text x="400" y="112" class="gold-sub">CODEX CYBERNETICUS · HOMO UNIVERSALIS</text>
  <text x="400" y="134" class="parch-desc">Security Researcher · Bug Bounty Hunter · SAST &amp; Reverse Engineering</text>
</svg>
