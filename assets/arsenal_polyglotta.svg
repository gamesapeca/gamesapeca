<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="100%" height="200" fill="none">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Cinzel:wght@600;700&amp;family=EB+Garamond:wght@400;500&amp;display=swap');
      .panel-frame { stroke: #C5A059; stroke-width: 0.8; opacity: 0.4; fill: #12100E; fill-opacity: 0.7; }
      .cat-title { font-family: 'Cinzel', 'Georgia', serif; font-size: 12px; font-weight: 600; fill: #D4AF37; letter-spacing: 1.5px; }
      .pill-bg { fill: #1A1614; stroke: #C5A059; stroke-width: 0.6; opacity: 0.9; rx: 3; }
      .pill-text { font-family: 'Cinzel', 'Georgia', serif; font-size: 10.5px; font-weight: 600; fill: #D4AF37; text-anchor: middle; }
    </style>
  </defs>

  <!-- Outer Card Frame -->
  <rect x="10" y="10" width="780" height="180" rx="3" class="panel-frame" />
  <path d="M 10 25 L 25 10 M 790 25 L 775 10 M 10 175 L 25 190 M 790 175 L 775 190" stroke="#D4AF37" stroke-width="1" opacity="0.8" />

  <!-- ROW 1: SYSTEMS, COMPILERS & LOW-LEVEL -->
  <text x="30" y="38" class="cat-title">✦ SISTEMAS, COMPILADORES &amp; DISSECAÇÃO DE BAIXO NÍVEL</text>
  <g transform="translate(30, 48)">
    <!-- C -->
    <rect x="0" y="0" width="38" height="22" class="pill-bg" />
    <text x="19" y="15" class="pill-text">C</text>

    <!-- C++ -->
    <rect x="46" y="0" width="48" height="22" class="pill-bg" />
    <text x="70" y="15" class="pill-text">C++</text>

    <!-- Rust -->
    <rect x="102" y="0" width="56" height="22" class="pill-bg" />
    <text x="130" y="15" class="pill-text">RUST</text>

    <!-- Go -->
    <rect x="166" y="0" width="44" height="22" class="pill-bg" />
    <text x="188" y="15" class="pill-text">GO</text>

    <!-- Assembly x86_64 -->
    <rect x="218" y="0" width="128" height="22" class="pill-bg" />
    <text x="282" y="15" class="pill-text">ASSEMBLY x86_64</text>

    <!-- ARM64 -->
    <rect x="354" y="0" width="68" height="22" class="pill-bg" />
    <text x="388" y="15" class="pill-text">ARM64</text>

