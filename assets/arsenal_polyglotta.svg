    <!-- Azure Entra -->
    <rect x="174" y="0" width="96" height="22" class="pill-bg" />
    <text x="222" y="15" class="pill-text">AZURE ENTRA</text>

    <!-- Kubernetes -->
    <rect x="278" y="0" width="98" height="22" class="pill-bg" />
    <text x="327" y="15" class="pill-text">KUBERNETES</text>

    <!-- Terraform -->
    <rect x="384" y="0" width="92" height="22" class="pill-bg" />
    <text x="430" y="15" class="pill-text">TERRAFORM</text>

    <!-- Docker -->
    <rect x="484" y="0" width="68" height="22" class="pill-bg" />
    <text x="518" y="15" class="pill-text">DOCKER</text>

    <!-- GitHub Actions -->
    <rect x="560" y="0" width="124" height="22" class="pill-bg" />
    <text x="622" y="15" class="pill-text">GITHUB ACTIONS</text>

    <!-- Linux -->
    <rect x="692" y="0" width="58" height="22" class="pill-bg" />
    <text x="721" y="15" class="pill-text">LINUX</text>
