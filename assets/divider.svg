<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%" height="40" fill="none">
  <defs>
    <style>
      .div-gold { stroke: #D4AF37; stroke-width: 1; opacity: 0.8; }
      .div-faint { stroke: #C5A059; stroke-width: 0.6; opacity: 0.35; }
      .fleuron {
        fill: #D4AF37;
        font-size: 14px;
        text-anchor: middle;
      }
    </style>
  </defs>

  <!-- Left Lines -->
  <line x1="60" y1="20" x2="310" y2="20" class="div-faint" />
  <line x1="180" y1="20" x2="325" y2="20" class="div-gold" />
  <circle cx="335" cy="20" r="2" fill="#D4AF37" />

  <!-- Center Heraldic Motif -->
  <text x="400" y="25" class="fleuron">⚜  ·  ✦  ·  ⚜</text>

  <!-- Right Lines -->
  <circle cx="465" cy="20" r="2" fill="#D4AF37" />
  <line x1="475" y1="20" x2="620" y2="20" class="div-gold" />
  <line x1="490" y1="20" x2="740" y2="20" class="div-faint" />
</svg>
