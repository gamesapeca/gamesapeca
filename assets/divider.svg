<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 40" width="100%" height="40" fill="none">
  <defs>
    <style>
      @keyframes goldPulseFleur {
        0%, 100% { opacity: 0.8; filter: drop-shadow(0 0 1px rgba(212, 175, 55, 0.3)); }
        50% { opacity: 1; filter: drop-shadow(0 0 6px rgba(212, 175, 55, 0.9)); }
      }
      @keyframes sweepLight {
        0% { stroke-dashoffset: 400; }
        100% { stroke-dashoffset: -400; }
      }

      .div-gold { stroke: #D4AF37; stroke-width: 1; opacity: 0.85; }
      .div-faint { stroke: #C5A059; stroke-width: 0.6; opacity: 0.35; }
      .fleuron {
        fill: #D4AF37;
        font-size: 14px;
        text-anchor: middle;
        animation: goldPulseFleur 3.5s ease-in-out infinite;
      }
      .sweep-line {
        stroke: url(#sweepGrad);
        stroke-width: 1.4;
        stroke-dasharray: 60 200;
        animation: sweepLight 5s linear infinite;
      }
    </style>

    <linearGradient id="sweepGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFF8DC" stop-opacity="1" />
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Left Lines -->
  <line x1="50" y1="20" x2="340" y2="20" class="div-faint" />
  <line x1="180" y1="20" x2="355" y2="20" class="div-gold" />
  <line x1="180" y1="20" x2="355" y2="20" class="sweep-line" />
  <circle cx="365" cy="20" r="2.5" fill="#D4AF37" />

  <!-- Center Heraldic Motif -->
  <text x="400" y="25" class="fleuron">⚜  ·  ✦  ·  ⚜</text>

  <!-- Right Lines -->
  <circle cx="435" cy="20" r="2.5" fill="#D4AF37" />
  <line x1="445" y1="20" x2="620" y2="20" class="div-gold" />
  <line x1="445" y1="20" x2="620" y2="20" class="sweep-line" />
  <line x1="460" y1="20" x2="750" y2="20" class="div-faint" />
</svg>
