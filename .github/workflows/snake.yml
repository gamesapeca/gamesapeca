name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Generate Snake SVG
        uses: Platane/snk@v3
        with:
          github_user_name: gamesapeca
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%23D4AF37&color_dots=%23FAF5EE,%23E8D3A3,%23C5A059,%23A67C52,%235D4037
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=%23D4AF37&color_dots=%2312100E,%233D2E1E,%236B5233,%23A6804A,%23D4AF37
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push Snake SVG to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
